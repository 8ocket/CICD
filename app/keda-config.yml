--- # ai
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: mindlog-ai-scaler
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  scaleTargetRef:
    name: mindlog-ai-deployment
  minReplicaCount: 1
  maxReplicaCount: 5
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
        metricName: bedrock_queue_length
        query: bedrock_queue_length{app="mindlog-ai"}
        threshold: '5'
    - type: cpu
      metadata:
        type: Utilization
        value: '70'

--- # be
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: mindlog-be-scaler
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  scaleTargetRef:
    name: mindlog-be-deployment
  minReplicaCount: 2
  maxReplicaCount: 10
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
        metricName: http_requests_total
        query: sum(rate(http_server_requests_seconds_count[1m]))
        threshold: '100'
    - type: cpu
      metadata:
        type: Utilization
        value: '70'

--- # fe
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: mindlog-fe-scaler
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  scaleTargetRef:
    name: mindlog-fe-deployment
  minReplicaCount: 2
  maxReplicaCount: 5
  triggers:
    - type: cpu
      metadata:
        type: Utilization
        value: '60'
    - type: memory
      metadata:
        type: Utilization
        value: '70'