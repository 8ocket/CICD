apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mindlog-backend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/8ocket/CICD.git'
    targetRevision: HEAD
    path: backend 
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default 
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false 
    syncOptions:
      - CreateNamespace=true 
---
