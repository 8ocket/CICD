apiVersion: apps/v1
kind: Deployment
metadata:
  name: mindlog-fe-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mindlog-fe
  template:
    metadata:
      labels:
        app: mindlog-fe
    spec:
      containers:
      - name: frontend
        # 젠킨스 빌드 후 생성된 ECR 이미지 주소로 교체
        image: <ECR주소>/mindlog-fe:latest
        ports:
        - containerPort: 3000
        
        # Readiness 체크
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
        
        # 리소스 제한
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
