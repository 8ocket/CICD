#cicd/backend/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mindlog-be-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mindlog-be
  template:
    metadata:
      labels:
        app: mindlog-be
    spec:
      containers:
      - name: backend
        image: ${ECR_URL}/mindlog-be:latest
        ports:
        - containerPort: 8080
        env:
        - name: PROFILE
          value: "dev"
          
        - name: DB_DEV_HOST
          value: "${RDS_ENDPOINT}"
        - name: DB_DEV_PORT
          value: "5432"
        - name: DB_DEV_DATABASE
          value: "mindlog_db"
        - name: DB_DEV_USERNAME
          value: "mindlog"
        - name: DB_DEV_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mindlog-be-secret
              key: DB_PASSWORD
              
        # Redis 설정
        - name: REDIS_DEV_HOST
          value: "${REDIS_ENDPOINT}"
        - name: SPRING_DATA_REDIS_HOST  # 이 줄을 추가
          value: "${REDIS_ENDPOINT}"    # 이 줄도 추가
        - name: REDIS_DEV_PORT
          value: "6379"
          
        # S3 설정
        - name: AWS_S3_BUCKET_NAME
          value: "${S3_BUCKET_NAME}"
        - name: AWS_REGION
          value: "ap-northeast-2"
        - name: KT_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: mindlog-be-secret
              key: KT_JWT_SECRET
              
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
