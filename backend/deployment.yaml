# /cicd/backend/deployment.yaml.template
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mindlog-be-sa
  namespace: default

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mindlog-be-deployment

spec:
  replicas: 2
  selector:
    matchLabels:
      app: mindlog-be
  template:
    metadata:
      annotations:
        instrumentation.newrelic.com/inject-java: "true"
      labels:
        app: mindlog-be
    spec:

      initContainers:
        - name: wait-for-ai-migration
          image: busybox:1.28
          command:
            - 'sh'
            - '-c'
            - >
              until nc -zv mindlog-ai-service 8000; do
                sleep 5;
              done;

      serviceAccountName: mindlog-be-sa
      containers:
      - name: backend
        image: 854439979580.dkr.ecr.ap-northeast-2.amazonaws.com/mindlog-be:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        # --- [New Relic] -----------------------------
        - name: NEW_RELIC_LICENSE_KEY
          value: LICENSE_KEY
        - name: NEW_RELIC_APP_NAME
          value: "mindlog-be-prod"

        # --- [Spring Profiles] -----------------------
        - name: SPRING_PROFILES_ACTIVE
          value: "dev"
        - name: PROFILE
          value: "dev"

        # --- [Dynamic] -------------------------------
        - name: DB_DEV_HOST
          value: "rds-prod-8ocket.c5g8ga08stkl.ap-northeast-2.rds.amazonaws.com"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://$(DB_DEV_HOST):5432/mindlog_db?sslmode=require"

        - name: SPRING_DATA_REDIS_HOST
          value: "redis"
        - name: SPRING_DATA_REDIS_PORT
          value: "6379"

        # --- [Secret] --------------------------------
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: mindlog-be-secret
              key: DB_USERNAME
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mindlog-be-secret
              key: DB_PASSWORD
        - name: KT_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: mindlog-be-secret
              key: KT_JWT_SECRET

        # --- [Static] --------------------------------
        - name: SPRING_JPA_DATABASE_PLATFORM
          value: "org.hibernate.dialect.PostgreSQLDialect"
        - name: AWS_S3_BUCKET_NAME
          value: "8ocket-backend-photos-prod"
        - name: AWS_REGION
          value: "ap-northeast-2"
        - name: DEFAULT_PROFILE_IMAGE
          value: "https://8ocket-backend-photos-prod.s3.ap-northeast-2.amazonaws.com/profile/profile-default.png"
        - name: DEFAULT_PERSONA_IMAGE
          value: "https://8ocket-backend-photos-prod.s3.ap-northeast-2.amazonaws.com/persona/toast.png"
        - name: TEST_PERSONA_IMAGE
          value: "https://8ocket-backend-photos-prod.s3.ap-northeast-2.amazonaws.com/persona/toast.png"

        - name: MANAGEMENT_HEALTH_REDIS_ENABLED
          value: "false"

        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 5 
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 40
          periodSeconds: 10
          failureThreshold: 5 
          timeoutSeconds: 5
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1024Mi"
