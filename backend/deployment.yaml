#cicd/backend/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mindlog-be-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mindlog-be
  template:
    metadata:
      labels:
        app: mindlog-be
    spec:
      containers:
      - name: backend
        image: \${ECR_URL}/mindlog-be:latest
        ports:
        - containerPort: 8080
        env:
        - name: PROFILE
          value: "dev"
        - name: DB_HOST
          value: "\${DB_HOST}"
        - name: DB_PORT
          value: "5432"
        - name: DB_DATABASE
          value: "mindlog_db"
        - name: DB_USERNAME
          value: "mindlog"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mindlog-be-secret
              key: DB_PASSWORD
        - name: REDIS_HOST
          value: "\${REDIS_HOST}"
        - name: REDIS_PORT
          value: "6379"
        - name: KT_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: mindlog-be-secret
              key: KT_JWT_SECRET
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
