# /cicd/backend/deployment.yaml.template
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mindlog-be-sa
  namespace: default

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mindlog-be-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mindlog-be
  template:
    metadata:
      annotations:
        instrumentation.newrelic.com/inject-java: "true"
      labels:
        app: mindlog-be
    spec:
      initContainers:
        - name: wait-for-ai-migration
          image: busybox:1.28
          command:
            - 'sh'
            - '-c'
            - >
              until nc -zv mindlog-ai-service 8000; do
                sleep 5;
              done;

      serviceAccountName: mindlog-be-sa
      containers:
      - name: backend
        image: 854439979580.dkr.ecr.ap-northeast-2.amazonaws.com/mindlog-be:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        # --- [New Relic] -----------------------------
        - name: NEW_RELIC_LICENSE_KEY
          valueFrom:
            secretKeyRef:
              name: mindlog-be-secret
              key: LICENSE_KEY
        - name: NEW_RELIC_APP_NAME
          value: "mindlog-be-prod"

        # --- [Spring Profiles] -----------------------
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: PROFILE
          valueFrom:
            secretKeyRef:
              name: mindlog-be-secret
              key: PROFILE

        # --- [Database & Redis Dynamic] --------------
        - name: DB_HOST
          value: "localhost"
          #value: "rds-prod-8ocket.c5g8ga08stkl.ap-northeast-2.rds.amazonaws.com"
        - name: DB_DATABASE
          value: "mindlog_db"
        - name: DB_PASSWORD
          value: "test1234"
        - name: DB_PORT
          value: "5432"
        - name: DB_USERNAME
          value: "mindlog"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://rds-prod-8ocket.c5g8ga08stkl.ap-northeast-2.rds.amazonaws.com:5432/mindlog_db?sslmode=require"
        - name: SPRING_DATA_REDIS_HOST
          value: "master.valkey-prod-8ocket.q6r4ah.apn2.cache.amazonaws.com"
        - name: REDIS_HOST
          value: "localhost"
        - name: REDIS_PORT
          value: "6379"

        # --- [Credentials from Secret] ---------------
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: mindlog-be-secret
              key: DB_USERNAME
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mindlog-be-secret
              key: DB_PASSWORD
        - name: KT_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: mindlog-be-secret
              key: KT_JWT_SECRET
        - name: ENCRYPT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: mindlog-be-secret
              key: ENCRYPT_SECRET_KEY

        # --- [Social Login] --------------------------
        - name: KAKAO_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: mindlog-be-secret
              key: KAKAO_CLIENT_ID
        - name: KAKAO_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: mindlog-be-secret
              key: KAKAO_CLIENT_SECRET
        - name: KAKAO_PROD_REDIRECT_URI
          valueFrom:
            secretKeyRef:
              name: mindlog-be-secret
              key: KAKAO_PROD_REDIRECT_URI
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: mindlog-be-secret
              key: GOOGLE_CLIENT_ID
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: mindlog-be-secret
              key: GOOGLE_CLIENT_SECRET
        - name: GOOGLE_PROD_REDIRECT_URI
          valueFrom:
            secretKeyRef:
              name: mindlog-be-secret
              key: GOOGLE_PROD_REDIRECT_URI

        # --- [AWS Storage & Payments] ----------------
        - name: AWS_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: mindlog-be-secret
              key: AWS_ACCESS_KEY
        - name: AWS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: mindlog-be-secret
              key: AWS_SECRET_KEY
        - name: TOSS_CLIENT_KEY
          valueFrom:
            secretKeyRef:
              name: mindlog-be-secret
              key: TOSS_CLIENT_KEY
        - name: TOSS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: mindlog-be-secret
              key: TOSS_SECRET_KEY
        - name: SESSION_BASE_URL
          valueFrom:
            secretKeyRef:
              name: mindlog-be-secret
              key: SESSION_BASE_URL
        - name: TOSS_BASE_URL
          valueFrom:
            secretKeyRef:
              name: mindlog-be-secret
              key: TOSS_BASE_URL

        # --- [Static Assets] -------------------------
        - name: SPRING_JPA_DATABASE_PLATFORM
          value: "org.hibernate.dialect.PostgreSQLDialect"
        - name: AWS_S3_BUCKET_NAME
          value: "8ocket-backend-photos-prod"
        - name: AWS_REGION
          value: "ap-northeast-2"
        - name: DEFAULT_PROFILE_IMAGE
          value: "https://8ocket-backend-photos-prod.s3.ap-northeast-2.amazonaws.com/profile/profile-default.png"
        - name: DEFAULT_PERSONA_IMAGE
          value: "https://8ocket-backend-photos-prod.s3.ap-northeast-2.amazonaws.com/persona/persona-default.png"
        - name: TEST_PERSONA_IMAGE
          value: "https://8ocket-backend-photos-prod.s3.ap-northeast-2.amazonaws.com/persona/persona-default.png"

        - name: MANAGEMENT_HEALTH_REDIS_ENABLED
          value: "false"

#----------------added
        - name: SESSION_MESSAGE_URI
          valueFrom:
            secretKeyRef:
              name: mindlog-be-secret
              key: SESSION_MESSAGE_URI
        - name: SESSION_FINALIZE_URI
          valueFrom:
            secretKeyRef:
              name: mindlog-be-secret
              key: SESSION_FINALIZE_URI
        - name: REPORT_URI
          valueFrom:
            secretKeyRef:
              name: mindlog-be-secret
              key: REPORT_URI
        - name: SESSION_URI
          valueFrom:
            secretKeyRef:
              name: mindlog-be-secret
              key: SESSION_URI
        - name: CORS_PROD_URL
          valueFrom:
            secretKeyRef:
              name: mindlog-be-secret
              key: CORS_PROD_URL
        - name: SPRING_DATA_REDIS_SSL_ENABLED
          value: "TRUE"

        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 5
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 5
          timeoutSeconds: 5
