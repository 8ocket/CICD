apiVersion: apps/v1
kind: Deployment
metadata:
  name: mindlog-be-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mindlog-be
  template:
    metadata:
      labels:
        app: mindlog-be
    spec:
      containers:
      - name: backend
        image: 8ocket-prod-be-repo:tmp
        ports:
        - containerPort: 8080
        env:
        - name: PROFILE
          value: "dev"
        - name: DB_HOST
          value: "rds-prod-8ocket.xxxx.ap-northeast-2.rds.amazonaws.com" #교체 예정
        - name: DB_PORT
          value: "5432"
        - name: DB_DATABASE
          value: "testdb"
        - name: DB_USERNAME
          value: "dbadmin"
        - name: DB_PASSWORD
          value: "test1234"
        - name: REDIS_HOST
          value: "valkey-prod-8ocket.xxxx.cache.amazonaws.com" #  교체 예정
        - name: REDIS_PORT
          value: "6379"
          
        # OAuth 및 기타 설정 
        - name: KT_JWT_SECRET
          value: "kt-cloud-8ocket-mindLog-jwt-secret-key"
        - name: KAKAO_CLIENT_ID
          value: "d2332c4b0c4fde2d5d528c56bdc95064"
        # 필요시 추가 변수 삽입
