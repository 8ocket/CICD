apiVersion: apps/v1
kind: Deployment
metadata:
  name: mindlog-be-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mindlog-be
  template:
    metadata:
      labels:
        app: mindlog-be
    spec:
      containers:
      - name: backend
        image: 854439979580.dkr.ecr.ap-northeast-2.amazonaws.com/mindlog-be:latest
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "dev"
        - name: PROFILE
          value: "dev"
        - name: SPRING_APPLICATION_JSON
          value: >
            {
              "spring": {
                "datasource": {
                  "url": "jdbc:postgresql://rds:5432/mindlog_dev",
                  "username": "mindlog",
                  "password": "test1234",
                  "driver-class-name": "org.postgresql.Driver"
                },
                "data": {
                  "redis": {
                    "host": "redis"
                  }
                },
                "jpa": {
                  "database-platform": "org.hibernate.dialect.PostgreSQLDialect",
                  "hibernate": {
                    "ddl-auto": "update"
                  }
                }
              }
            }
        
        - name: KT_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: mindlog-be-secret
              key: KT_JWT_SECRET
        - name: AWS_S3_BUCKET_NAME
          value: "test-project-test-photos"
        - name: AWS_REGION
          value: "ap-northeast-2"

        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 180
