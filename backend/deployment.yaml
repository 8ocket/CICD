apiVersion: apps/v1
kind: Deployment
metadata:
  name: mindlog-be-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mindlog-be
  template:
    metadata:
      labels:
        app: mindlog-be
    spec:
      containers:
      - name: backend
        image: <ECR_URL>/mindlog-be:latest  # ecr address update needed
        ports:
        - containerPort: 8080
        env:
        - name: PROFILE
          value: "dev"
        - name: DB_HOST
          value: "rds" # Service Name or RDS endpoint
        - name: DB_PORT
          value: "5432"
        - name: DB_DATABASE
          value: "testdb"
          #
        - name: DB_USERNAME
          value: "dbadmin"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mindlog-be-secret
              key: DB_PASSWORD
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
          #
        - name: KT_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: mindlog-be-secret
              key: KT_JWT_SECRET
