apiVersion: apps/v1
kind: Deployment
metadata:
  name: mindlog-be-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mindlog-be
  template:
    metadata:
      labels:
        app: mindlog-be
    spec:
      containers:
      - name: backend
        # ECR 주소도 변수로 처리! deploy.sh에서 치환하세요.
        image: 854439979580.dkr.ecr.ap-northeast-2.amazonaws.com/mindlog-be:latest
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "dev"
        - name: PROFILE
          value: "dev"
        
        # RDS 엔드포인트 치환용
        - name: DB_DEV_HOST
          value: "${RDS_ENDPOINT}"

        # DB 연결 설정 (시크릿 연동)
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://$(DB_DEV_HOST):5432/mindlog_db"
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: mindlog-be-secret
              key: DB_USERNAME
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mindlog-be-secret
              key: DB_PASSWORD
        
        - name: SPRING_DATA_REDIS_HOST
          value: "redis"

        # 기존 보안/환경 설정 유지
        - name: KT_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: mindlog-be-secret
              key: KT_JWT_SECRET
        - name: AWS_S3_BUCKET_NAME
          value: "test-project-test-photos"
        - name: AWS_REGION
          value: "ap-northeast-2"

        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 180
