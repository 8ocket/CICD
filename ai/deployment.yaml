apiVersion: apps/v1
kind: Deployment
metadata:
  name: mindlog-ai-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mindlog-ai
  template:
    metadata:
      labels:
        app: mindlog-ai
    spec:
      containers:
      - name: ai-api
        image: ${ECR_URL}/mindlog-ai:latest
        ports:
        - containerPort: 8000
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mindlog-ai-secret
              key: DB_PASSWORD
        - name: DATABASE_URL
          value: "postgresql://${DB_USER}:$(DB_PASSWORD)@${RDS_ENDPOINT}:5432/${DB_NAME}?sslmode=require"
        - name: REDIS_URL
          value: "redis://${REDIS_ENDPOINT}:6379/0"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: mindlog-ai-secret
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: mindlog-ai-secret
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_REGION
          value: "ap-northeast-2"
        - name: BEDROCK_MODEL_ID
          value: "anthropic.claude-haiku-4-5-20251001-v1:0"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10apiVersion: apps/v1
kind: Deployment
metadata:
  name: mindlog-ai-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mindlog-ai
  template:
    metadata:
      labels:
        app: mindlog-ai
    spec:
      containers:
      - name: ai-api
        image: ${ECR_URL}/mindlog-ai:latest
        ports:
        - containerPort: 8000
        env:
        # 
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mindlog-ai-secret
              key: DB_PASSWORD
              
        - name: DATABASE_URL
          value: "postgresql://dbadmin:$(DB_PASSWORD)@${DB_HOST}:5432/testdb?sslmode=require"
        - name: REDIS_URL
          value: "redis://redis:6379/0"
        # AWS Bedrock access
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: mindlog-ai-secret
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: mindlog-ai-secret
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_REGION
          value: "ap-northeast-2"
        - name: BEDROCK_MODEL_ID
          value: "anthropic.claude-haiku-4-5-20251001-v1:0"

        # healtcheck
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
