# /cicd/ai/deployment.yaml.template
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mindlog-ai-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mindlog-ai
  template:
    metadata:
      annotations:
        instrumentation.newrelic.com/inject-python: "true"
      labels:
        app: mindlog-ai
    spec:
      containers:
      - name: ai-api
        image: 854439979580.dkr.ecr.ap-northeast-2.amazonaws.com/mindlog-ai:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
        env:
        # --- [New Relic] ---------------------------
        - name: NEW_RELIC_LICENSE_KEY
          valueFrom:
            secretKeyRef:
              name: mindlog-ai-secret
              key: LICENSE_KEY
        - name: NEW_RELIC_APP_NAME
          value: "mindlog-ai-prod"

        # --- [Static & DB Settings] ----------------
        - name: DB_PORT
          value:5432
        - name: DB_DATABASE
          value: "mindlog_db"
        - name: DB_USERNAME
          value: "mindlog"
        - name: DB_PASSWORD
          value: "test1234"
        - name: AWS_REGION
          value: "ap-northeast-2"
        - name: DB_HOST
          value: "localhost "
        - name: USE_BEDROCK
          value: "True"       
#value: "rds-prod-8ocket.c5g8ga08stkl.ap-northeast-2.rds.amazonaws.com"
        - name: OPENAI_MODEL_CHAT
          value: "gpt-4o-mini"
        - name: OPENAI_MODEL_IMAGE
          value: "dall-e-3"
        - name: OPENAI_MAX_TOKERNS
          value: "2000"
        - name: OPENAI_TEMPERATURE
          value: "0.7"
        - name: S3_BUCKET_NAME
          value: "test-project-test-photos"
        - name: PROPOSITION_ENCRYPT
          value: "False"
        - name: CELERY_BROKER_URL
          value: "redis://redis:6379/0"
        - name: CELERY_RESULT_BACKEND
          value: "redis://redis:redis:6379/0"

        # --- [Dynamic URLs] ------------------------
        - name: REDIS_URL
          value: "rediss://master.valkey-prod-8ocket.q6r4ah.apn2.cache.amazonaws.com:6379/0"
        - name: DATABASE_URL
          value: "postgresql://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):5432/$(DB_NAME)?sslmode=require"

        # --- [AWS Bedrock] -------------------------
        - name: BEDROCK_MODEL_ID
          value: "apac.anthropic.claude-3-haiku-20240307-v1:0"
        - name: BEDROCK_SUMMARY_MODEL_ID
          value: "global.anthropic.claude-haiku-4-5-20251001-v1:0"
        - name: BEDROCK_GUARDRAIL_ID
          value: "mhcfgpsodiox"
        - name: BEDROCK_GUARDRAIL_VERSION
          value: "DRAFT"
        - name: BEDROCK_GUARDRAIL_TRACE
          value: "true"
        - name: BEDROCK_EMBEDDING_MODEL_ID
          value: "amazon.titan-embed-text-v2:0"
        - name: EMBEDDING_DIMENSIONS
          value: "1024"
        - name: ALGORITHM
          value: "HS256"
        - name: ACCESS_TOKEN_EXPIRE_MINUTES
          value: "60"
        - name: ENABLE_CRISIS_DETECTION
          value: "True"
        - name: ENABLE_STREAMING
          value: "True"

        # --- [Secrets] -----------------------------
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: mindlog-ai-secret
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: mindlog-ai-secret
              key: AWS_SECRET_ACCESS_KEY
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: mindlog-ai-secret
              key: SECRET_KEY
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: mindlog-ai-secret
              key: OPENAI_API_KEY

        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1024Mi"
