apiVersion: apps/v1
kind: Deployment
metadata:
  name: mindlog-ai-deployment
spec:
  replicas: 1
  template:
    spec:
      containers:
      - name: ai-api
        image: <ECR주소>/mindlog-ai:latest # 나중에 주소 교체
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          value: "postgresql://mindlog:password@rds-주소:5432/mindlog_prod"
        - name: REDIS_URL
          value: "redis://valkey-주소:6379/0"
        # 헬스체크 
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
